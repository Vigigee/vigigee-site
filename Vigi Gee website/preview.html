<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VigiGee — Mobile Preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#111;--bg:#e8e6e4;--coral:#f4685c;--panel:#1b1a19}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#111;color:#f0eeec;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:26px 16px 60px}
  .head{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .title{font-size:15px;letter-spacing:.02em;opacity:.9}
  .title b{color:var(--coral)}
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{background:#232221;border:1px solid #333;color:#e9e7e5;font-size:13px;letter-spacing:.02em;
    padding:8px 15px;border-radius:100px;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease}
  .tab:hover{background:#2f2e2c}
  .tab.on{background:var(--coral);border-color:var(--coral);color:#fff}
  .sizes{display:flex;gap:8px;align-items:center;margin-bottom:18px;font-size:12px;opacity:.75}
  .size{background:#232221;border:1px solid #333;color:#e9e7e5;font-size:12px;padding:6px 12px;
    border-radius:100px;cursor:pointer}
  .size.on{background:#e9e7e5;color:#111;border-color:#e9e7e5}
  .phone{position:relative;background:#000;border-radius:44px;padding:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);transition:width .25s ease}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:24px;
    background:#000;border-radius:0 0 16px 16px;z-index:5;pointer-events:none}
  .screen{border-radius:32px;overflow:hidden;background:#fff;display:block}
  iframe{border:0;display:block;background:#fff}
  .hint{margin-top:16px;font-size:12px;opacity:.5;text-align:center;max-width:360px;line-height:1.5}
  a.open{color:var(--coral);text-decoration:none}
</style>
</head>
<body>
  <div class="head">
    <div class="title"><b>VigiGee</b> — mobile preview</div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-src="homepage-direction.html">Home</button>
      <button class="tab" data-src="work.html">Work</button>
      <button class="tab" data-src="logos.html">Logos</button>
      <button class="tab" data-src="about.html">About</button>
      <button class="tab" data-src="contact.html">Contact</button>
      <button class="tab" data-src="project.html">Project</button>
    </div>
  </div>

  <div class="sizes" id="sizes">
    <span>Screen:</span>
    <button class="size on" data-w="390">iPhone (390)</button>
    <button class="size" data-w="360">Small (360)</button>
    <button class="size" data-w="430">Large (430)</button>
  </div>

  <div class="phone" id="phone" style="width:414px">
    <div class="notch"></div>
    <div class="screen">
      <iframe id="frame" src="homepage-direction.html" width="390" height="820" title="Mobile preview"></iframe>
    </div>
  </div>

  <div class="hint">
    This is the real site rendered at phone width. Tap the buttons to switch pages.<br>
    <a class="open" id="openReal" href="homepage-direction.html" target="_blank">Open the live page in a new tab →</a>
  </div>

<script>
  var frame=document.getElementById('frame');
  var phone=document.getElementById('phone');
  var openReal=document.getElementById('openReal');
  var curSrc='homepage-direction.html', curW=390;
  function apply(){
    frame.src=curSrc;
    frame.width=curW;
    phone.style.width=(curW+24)+'px';
    openReal.href=curSrc;
  }
  document.getElementById('tabs').addEventListener('click',function(e){
    var b=e.target.closest('.tab'); if(!b) return;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); curSrc=b.dataset.src; apply();
  });
  document.getElementById('sizes').addEventListener('click',function(e){
    var b=e.target.closest('.size'); if(!b) return;
    document.querySelectorAll('.size').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); curW=parseInt(b.dataset.w,10); apply();
  });
  apply();
</script>
</body>
</html>
